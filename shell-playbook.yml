# ansible-playbook -i inventory.ini -K shell-playbook.yml
# Comprova que funciona el shell només amb el localhost
# Usa els mòduls debug i shell.
# Guarda i mostra una variable en el facts-playbook.yml
# Demana la paraula de pas per els hosts. Ha de ser el mateix usuari contrasenya
---
- name: Echo message on localhost
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars:
    message: "Hello from Ansible playbook on localhost!"

  tasks:
    - name: Echo message and connection type
      ansible.builtin.shell: " echo '{{ message }}' ; echo 'Connection type: {{ ansible_connection }}'"
      changed_when: false
      register: echo_output

    - name: Display output
      ansible.builtin.debug:
        msg: "{{ echo_output.stdout_lines }}"
