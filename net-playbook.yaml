---
- name: Network Information Center (NIC)
  hosts: all
  gather_facts: true
#  become: yes

  tasks:
   - name: Display Hostname
     debug:
       msg: "Hostname: {{ ansible_hostname }}"

   - name: Display Operating System
     debug:
       msg: "Operating System: {{ ansible_distribution }} {{ ansible_distribution_version }}"

   - name: Check CPU and total memory
     debug:
       msg: "CPU Architecture: {{ ansible_architecture }}, Total Memory: {{ ansible_memtotal_mb }} MB"

   - name: Check disk space
     debug:
       msg: "Disk Space on /dev/sda: Total={{ (ansible_mounts[0].size_total / 1024 / 1024 / 1024) | round(2) }} - Disk space Available={{ (ansible_mounts[0].size_available / 1024 / 1024 / 1024) | round(2) }} GB"
